<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bet Ligue1Maggle V11.4.10</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#17191c}.app{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}h1{margin:8px 0}button{border:0;border-radius:11px;padding:12px 14px;background:#111827;color:#fff;font-weight:800;cursor:pointer}button.alt{background:#eef0f3;color:#111}.full{width:100%}.muted{color:#6b7280;font-size:13px}.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px}.p{font-size:11px;text-align:center;background:#f8fafc;border-radius:10px;padding:8px 3px}.match,.row{padding:10px 0;border-bottom:1px solid #eee}.picks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(110px,1fr);gap:4px;margin-top:6px;overflow-x:auto;padding-bottom:4px}.pick{text-align:center;background:#f8fafc;padding:6px;border-radius:7px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.multipliers{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.multipliers button{min-width:64px}.stake{display:flex;gap:4px;align-items:center}.stake input{width:58px;padding:8px;border:1px solid #ddd;border-radius:8px;text-align:center}.status{padding:10px;border-radius:10px;margin-top:10px;background:#eef2ff;font-size:13px}.bad{background:#fdeaea;color:#922}.good{background:#e7f7ee;color:#185}.hidden{display:none}.qr{text-align:center}.qr img{width:230px;max-width:85%}@media(max-width:560px){.app{padding:12px}.top{grid-template-columns:repeat(2,minmax(0,1fr))}.p{font-size:10px}.row{align-items:flex-start;flex-direction:column}.stake{align-self:flex-end}}</style></head><body><div class="app"><h1>Ligue 1 Maggle</h1><div class="muted">V11.4.10 · 100 % Web · aucune extension</div><div class="card"><b id="health">Vérification serveur…</b><div id="healthD" class="muted"></div></div><div id="syncCard" class="card"><h2>Synchroniser Ligue1Maggle</h2><button class="full" id="sync">Synchroniser</button><div id="syncS"></div></div><div id="main" class="hidden"><div class="card"><h2 id="jt">Top 5</h2><div id="top" class="top"></div></div><div class="card"><h2>Affiches & pronostics</h2><div id="matches"></div></div><div class="card"><h2>Paris & mises</h2><div class="multipliers"><button class="alt mult" data-m="2">×2</button><button class="alt mult" data-m="3">×3</button><button class="alt mult" data-m="4">×4</button><button class="alt" id="reset1">Réinitialiser 1€</button></div><div id="rows"></div><div class="row"><b>Total</b><b id="total">0 €</b></div></div><button class="full" id="gen">Générer mon QR Parions Sport</button><div id="genS"></div><div id="qrCard" class="card qr hidden"><h2>QR officiel Parions Sport</h2><img id="qr"><div class="status good">QR reçu depuis l’e-bulletin Parions Sport.</div></div></div></div><script>
let D,sel=new Set,stakes={};const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const k=(i,n)=>i+'|'+n;async function api(a,o={}){const r=await fetch('/api/index?action='+a,o);const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error(`HTTP ${r.status} · réponse serveur non JSON${t?': '+t.slice(0,160).replace(/\s+/g,' '):''}`)}if(!r.ok||!j.ok)throw Error(j.error||`Erreur serveur HTTP ${r.status}`);return j}async function health(){try{const j=await api('health');health.textContent='Serveur V'+j.version+' prêt';healthD.textContent=j.browserlessConfigured?'Browserless configuré':'Browserless non configuré'}catch(e){health.textContent='Serveur indisponible';healthD.textContent=e.message}}
function bets(){const a=[];(D.matchs||[]).forEach((m,i)=>sel.forEach(n=>{const o=m.pronostics?.[n],num=m.eventNumber;if(['1','N','2'].includes(o)&&num)a.push({i,n,o,m,num,stake:stakes[k(i,n)]??1})}));return a}function multiplyAll(f){for(const b of bets())stakes[k(b.i,b.n)]=Math.max(1,Number(b.stake||1)*f);render()}function resetAll(){for(const b of bets())stakes[k(b.i,b.n)]=1;render()}function render(){const all=D.classement;jt.textContent='Journée '+(D.journee??'—')+' · '+all.length+' participants';document.getElementById('top').innerHTML=all.map((p,i)=>`<div class=p><label><input class=cb type=checkbox data-n="${E(p.joueur)}" ${sel.has(p.joueur)?'checked':''}> #${p.rang??i+1}</label><b>${E(p.joueur)}</b><div>${p.points} pts</div></div>`).join('');document.querySelectorAll('.cb').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.n):sel.delete(c.dataset.n);render()});matches.innerHTML=D.matchs.map(m=>`<div class=match><b>${E(m.domicile)} – ${E(m.exterieur)}</b><div class=picks>${all.map(p=>`<div class=pick><small>#${p.rang??''} ${E(p.joueur)}</small><br><b>${m.pronostics?.[p.joueur]||'—'}</b></div>`).join('')}</div></div>`).join('');const bs=bets();rows.innerHTML=bs.map(b=>`<div class=row><span>${E(b.m.domicile)} – ${E(b.m.exterieur)} · <b>${b.o}</b> · ${E(b.n)} · N°${b.num}</span><div class=stake><button class=alt data-d=-1 data-i=${b.i} data-n="${E(b.n)}">−</button><input class=st type=number min=1 data-i=${b.i} data-n="${E(b.n)}" value=${b.stake}><button class=alt data-d=1 data-i=${b.i} data-n="${E(b.n)}">+</button></div></div>`).join('')||`<div class=status>Aucun pari exploitable.${(D.matchs||[]).some(m=>!m.eventNumber)?' Correspondance Parions Sport manquante pour '+(D.matchs||[]).filter(m=>!m.eventNuber).map(m=>E(m.domicile)+'–'+E(m.exterieur)).join(', '):''}</div>`;document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{const q=k(+x.dataset.i,x.dataset.n);stakes[q]=Math.max(1,(stakes[q]??1)+(+x.dataset.d));render()});document.querySelectorAll('.st').forEach(x=>x.onchange=()=>{stakes[k(+x.dataset.i,x.dataset.n)]=Math.max(1,+x.value||1);render()});total.textContent=bs.reduce((s,b)=>s+b.stake,0).toFixed(2)+' €'}
document.querySelectorAll('.mult').forEach(b=>b.onclick=()=>multiplyAll(+b.dataset.m));reset1.onclick=resetAll;sync.onclick=async()=>{sync.disabled=true;syncS.className='status';syncS.textContent='Chromium distant → Ligue1Maggle…';try{const j=await api('sync',{method:'POST'});D=j.data;sel=new Set(D.classement.slice(0,3).map(x=>x.joueur));stakes={};render();main.classList.remove('hidden');syncS.className='status good';syncS.textContent='✓ Classement et pronostics récupérés'}catch(e){syncS.className='status bad';syncS.textContent='⛔ '+e.message}finally{sync.disabled=false}};gen.onclick=async()=>{const bs=bets();if(!bs.length)return;gen.disabled=true;qrCard.classList.add('hidden');genS.className='status';genS.textContent='Préparation Parions Sport dans Chromium distant…';const payload={bets:bs.map(b=>({eventNumber:b.num,outcome:b.o,stake:b.stake,home:b.m.domicile,away:b.m.exterieur}))};try{const j=await api('create-bulletin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});qr.src=j.qrDataUrl;qrCard.classList.remove('hidden');genS.className='status good';genS.textContent=`✓ ${j.count} sélection(s), ${Number(j.total).toFixed(2)} € · QR généré`}catch(e){genS.className='status bad';genS.textContent='⛔ '+e.message}finally{gen.disabled=false}};health();
</script></body></html>
