name: Upgrade V11.4.24
on:
  push:
    paths:
      - '.github/workflows/upgrade-v11424.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.24
        run: python .v11424_patch.py
      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw Error('script missing'); new Function(m[1]); console.log('frontend syntax OK')"
      - name: Commit V11.4.24
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .v11424_patch.py .github/workflows/upgrade-v11424.yml
          git add -A
          git commit -m 'Deploy V11.4.24 click QR action before Mes QR codes'
          git push
