name: Upgrade V11.4.25
on:
  push:
    paths:
      - '.v11425-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python .v11425_patch.py
      - name: Validate
        run: |
          node --check api/index.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11425.yml .v11425_patch.py .v11425-trigger
          git add -A
          git commit -m 'Deploy V11.4.25 sync current Ligue1Maggle matchday'
          git push
