name: Upgrade V11.4.15
on:
  push:
    paths:
      - '.v11415-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.15
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('api-index.js') if Path('api-index.js').exists() else Path('api/index.js')
          s = src.read_text()
          s = s.replace('11.4.14', '11.4.15')

          old = "const ws = direct || `wss://production-sfo.browserless.io?token=${encodeURIComponent(token)}&blockAds=true`;"
          new = "const base = direct || `wss://production-sfo.browserless.io?token=${encodeURIComponent(token)}&blockAds=true`;\n  const ws = /[?&]timeout=\\d+/i.test(base) ? base : `${base}${base.includes('?')?'&':'?'}timeout=120000`;"
          if old not in s:
              raise SystemExit('Browserless WS marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('export const config = { maxDuration: 180 };', 'export const config = { maxDuration: 300 };')

          Path('api').mkdir(exist_ok=True)
          Path('api/index.js').write_text(s)
          if src != Path('api/index.js'):
              src.unlink()

          p = Path('index.html')
          h = p.read_text().replace('V11.4.14', 'V11.4.15')
          p.write_text(h)

          p = Path('package.json')
          q = p.read_text().replace('"version":"11.4.14"', '"version":"11.4.15"')
          p.write_text(q)

          Path('vercel.json').write_text('{"$schema":"https://openapi.vercel.sh/vercel.json","functions":{"api/index.js":{"maxDuration":300}}}')
          PY
      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const start=h.indexOf('<script>'), end=h.lastIndexOf('</script>'); if(start<0||end<0) throw Error('script missing'); new Function(h.slice(start+8,end)); console.log('frontend syntax OK')"
      - name: Commit V11.4.15
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm -f .github/workflows/upgrade-v11415.yml .v11415-trigger
          git commit -m 'Deploy V11.4.15 extend Browserless and Vercel timeouts'
          git push
