name: Bootstrap V11.4.8
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V11.4.8 package
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v1148.zip
          unzip -o /tmp/v1148.zip -d .
          rm -f .github/workflows/bootstrap-v1148.yml
          git config user.name 'V11.4.8 bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy V11.4.8 complete package'
          git push
