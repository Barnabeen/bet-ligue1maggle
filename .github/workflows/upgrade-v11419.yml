name: Upgrade V11.4.19
on:
  push:
    paths:
      - '.v11419-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.19
        run: |
          echo '' | base64 -d | python
      - name: Validate
        run: |
          node --check api/index.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw Error('script missing'); new Function(m[1]);"
      - name: Commit V11.4.19
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11419.yml .v11419-trigger
          git add -A
          git commit -m 'Deploy V11.4.19 stable stake input mapping'
          git push
