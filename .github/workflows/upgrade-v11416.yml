name: Upgrade V11.4.16
on:
  push:
    paths:
      - '.v11416-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.16
        run: echo '' | base64 -d | python
      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw Error('script missing'); new Function(m[1]); console.log('frontend syntax OK')"
      - name: Commit V11.4.16
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/index.js index.html package.json
          git commit -m 'Deploy V11.4.16 faster Parions selection loop'
          git push
