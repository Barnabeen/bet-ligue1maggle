name: Upgrade V11.4.27
on:
  push:
    paths:
      - '.github/workflows/upgrade-v11427.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python .github/scripts/upgrade_v11427.py
      - name: Validate
        run: |
          node --check api/index.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11426.yml .github/workflows/upgrade-v11427.yml .github/scripts/upgrade_v11427.py
          git add -A
          git commit -m 'Deploy V11.4.27 adaptive matchday probing'
          git push
