name: Upgrade V11.4.26
on:
  push:
    paths:
      - '.github/workflows/upgrade-v11426.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.26
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text()
          reps=[
            ("if(Array.isArray(targetEvents)&&targetEvents.length && p.overlap<5){","if(Array.isArray(targetEvents)&&targetEvents.length && p.overlap===0){"),
            ("if(p.overlap>=5) break;","if(p.overlap>0) break;"),
            ("if(events.length && mapped.mappingDiagnostics?.mapped<5){","if(events.length && mapped.mappingDiagnostics?.mapped<1){"),
            ("Synchronisation Ligue1Maggle incohérente : seulement ${mapped.mappingDiagnostics?.mapped||0}/${mapped.matchs?.length||0} match(s) correspondent aux paris Ligue 1 actuellement ouverts.","Synchronisation Ligue1Maggle incohérente : aucun match Ligue1Maggle ne correspond aux paris Ligue 1 actuellement ouverts.")
          ]
          for old,new in reps:
            if old not in s: raise SystemExit('pattern not found: '+old)
            s=s.replace(old,new,1)
          s=s.replace('11.4.25','11.4.26')
          p.write_text(s)
          p=Path('index.html')
          t=p.read_text().replace('V11.4.25','V11.4.26')
          p.write_text(t)
          p=Path('package.json')
          t=p.read_text().replace('"version":"11.4.25"','"version":"11.4.26"')
          p.write_text(t)
          PY
      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);console.log('frontend syntax OK')"
      - name: Commit V11.4.26
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11426.yml
          git add -A
          git commit -m 'Deploy V11.4.26 dynamic current-match guardrail'
          git push
