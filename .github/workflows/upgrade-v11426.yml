name: Upgrade V11.4.26
on:
  push:
    paths:
      - '.github/workflows/upgrade-v11426.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.26
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text()

          s=s.replace("      if(matchs.length<5) return null;","      if(!matchs.length) return null;",1)

          a=s.index('    async function tryAdvanceJournee(currentJournee){')
          z=s.index('\n    const knownPlayers=p.joueurs;',a)
          replacement=r'''    function betterCandidate(a,b){
      if(!a) return b;
      if(!b) return a;
      if((b.overlap||0)!==(a.overlap||0)) return (b.overlap||0)>(a.overlap||0)?b:a;
      if(Number(!!b.visible)!==Number(!!a.visible)) return b.visible?b:a;
      if((b.journee||0)!==(a.journee||0)) return (b.journee||0)>(a.journee||0)?b:a;
      return (b.matchs?.length||0)>(a.matchs?.length||0)?b:a;
    }

    async function probeCurrentMatchday(){
      let best=extractPronostics();
      const probes=[];
      const record=(label,c)=>{
        probes.push({label,journee:c?.journee??null,overlap:c?.overlap||0,visible:!!c?.visible,matchs:c?.matchs?.map(m=>`${m.domicile}-${m.exterieur}`)||[]});
        best=betterCandidate(best,c);
      };
      record('initial',best);
      const targetCount=Array.isArray(targetEvents)?targetEvents.length:0;
      const complete=c=>targetCount>0 && (c?.overlap||0)>=Math.min(targetCount,Math.max(1,c?.matchs?.length||1));
      if(complete(best)) return {...best,probeDiagnostics:probes};

      const selectDescriptors=[...document.querySelectorAll('select')].filter(visible).map((sel,si)=>({
        si,
        key:norm([sel.id,sel.name,sel.className,sel.getAttribute('aria-label')].filter(Boolean).join(' ')),
        options:[...sel.options].map((o,oi)=>({oi,text:txt(o),value:o.value}))
      })).filter(x=>/jour|round|week|matchday|journ[ée]e/i.test(x.key)||x.options.filter(o=>/JOURN[ÉE]E?|^J\s*\d+|^\d+$/i.test(o.text)).length>=2);

      for(const d of selectDescriptors){
        for(const o of d.options){
          const sel=[...document.querySelectorAll('select')].filter(visible)[d.si];
          if(!sel) continue;
          sel.value=o.value;
          sel.dispatchEvent(new Event('input',{bubbles:true}));
          sel.dispatchEvent(new Event('change',{bubbles:true}));
          await sleep(320);
          const c=extractPronostics();
          record(`select:${d.si}:${o.text}`,c);
          if(complete(c)) return {...c,probeDiagnostics:probes};
        }
      }

      const likelyRoundControl=el=>{
        if(!visible(el)) return false;
        const text=txt(el);
        const meta=norm([text,el.id,el.className,el.getAttribute('aria-label'),el.getAttribute('title')].filter(Boolean).join(' '));
        if(/journ[ée]e|matchday|round|week|semaine/i.test(meta)) return true;
        if(/^(?:J(?:OURN[ÉE]E?)?\s*)?\d{1,2}$/i.test(text)){
          let cur=el.parentElement;
          for(let i=0;cur&&i<4;i++,cur=cur.parentElement){
            const ctx=norm([cur.id,cur.className,txt(cur)].filter(Boolean).join(' '));
            if(/journ[ée]e|matchday|round|week|semaine/i.test(ctx)) return true;
          }
        }
        return false;
      };

      let controls=[...document.querySelectorAll('button,a,[role="button"]')].filter(likelyRoundControl);
      const seenLabels=new Set();
      for(let i=0;i<controls.length;i++){
        controls=[...document.querySelectorAll('button,a,[role="button"]')].filter(likelyRoundControl);
        const el=controls[i]; if(!el) continue;
        const label=norm([txt(el),el.getAttribute('aria-label'),el.getAttribute('title')].filter(Boolean).join(' '));
        if(!label||seenLabels.has(label)) continue;
        seenLabels.add(label);
        try{ el.click(); }catch{ continue; }
        await sleep(360);
        const c=extractPronostics();
        record(`control:${label}`,c);
        if(complete(c)) return {...c,probeDiagnostics:probes};
      }

      for(let step=0;step<10;step++){
        const next=[...document.querySelectorAll('button,a,[role="button"]')].filter(visible).find(el=>{
          const t=norm([txt(el),el.getAttribute('aria-label'),el.getAttribute('title')].filter(Boolean).join(' '));
          return /(?:journ[ée]e?.*)?(suiv|next|prochain)|^(?:>|›|»|→)$/i.test(t);
        });
        if(!next) break;
        next.click();
        await sleep(360);
        const c=extractPronostics();
        record(`next:${step+1}`,c);
        if(complete(c)) return {...c,probeDiagnostics:probes};
      }

      return {...best,probeDiagnostics:probes};
    }

    let p=await probeCurrentMatchday();
    p.diagnostics={...(p.diagnostics||{}),probes:p.probeDiagnostics||[]};
'''
          s=s[:a]+replacement+s[z:]

          old="""        if(events.length && mapped.mappingDiagnostics?.mapped<5){\n          throw new Error(`Synchronisation Ligue1Maggle incohérente : seulement ${mapped.mappingDiagnostics?.mapped||0}/${mapped.matchs?.length||0} match(s) correspondent aux paris Ligue 1 actuellement ouverts.`);\n        }\n"""
          new="""        if(events.length){\n          const mappedCount=mapped.mappingDiagnostics?.mapped||0;\n          const comparable=Math.max(1,Math.min(events.length,mapped.matchs?.length||events.length));\n          const required=Math.max(1,Math.ceil(comparable*0.5));\n          if(mappedCount<required){\n            const probes=(mapped.sourceDiagnostics?.probes||[]).map(p=>`${p.label}:${p.journee??'?'}:${p.overlap}`).join(' | ');\n            throw new Error(`Synchronisation Ligue1Maggle incohérente : ${mappedCount}/${events.length} match(s) ouvert(s) reconnus, minimum dynamique=${required}. Probes=${probes||'aucun'}`);\n          }\n          mapped.syncGuard={openEvents:events.length,mapped:mappedCount,required};\n        }\n"""
          if old not in s: raise SystemExit('guard block not found')
          s=s.replace(old,new,1)

          s=s.replace('11.4.25','11.4.26')
          p.write_text(s)
          p=Path('index.html'); p.write_text(p.read_text().replace('V11.4.25','V11.4.26'))
          p=Path('package.json'); p.write_text(p.read_text().replace('"version":"11.4.25"','"version":"11.4.26"'))
          PY
      - name: Validate JavaScript
        run: |
          node --check api/index.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);console.log('frontend syntax OK')"
      - name: Commit V11.4.26
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11426.yml
          git add -A
          git commit -m 'Deploy V11.4.26 adaptive current matchday sync'
          git push
