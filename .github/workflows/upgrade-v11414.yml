name: Upgrade V11.4.14
on:
  push:
    paths:
      - '.v11414-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.14
        run: echo '' | base64 -d | python
      - name: Validate JavaScript
        run: |
          node --check api-index.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);console.log('frontend syntax OK')"
      - name: Commit and clean one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/upgrade-v11414.yml .v11414-trigger
          git add -A
          git commit -m 'Deploy V11.4.14 Parions numbers and Browserless retry'
          git push
