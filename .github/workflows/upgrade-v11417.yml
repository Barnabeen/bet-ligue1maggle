name: Upgrade V11.4.17
on:
  push:
    paths:
      - '.v11417-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.17
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text()
          s=s.replace("const ws = /[?&]timeout=\\d+/i.test(base) ? base : `${base}${base.includes('?')?'&':'?'}timeout=120000`;", "const sessionTimeout=Math.max(60000,Number(process.env.BROWSERLESS_SESSION_TIMEOUT_MS)||120000);\n  const ws = /[?&]timeout=\\d+/i.test(base) ? base : `${base}${base.includes('?')?'&':'?'}timeout=${sessionTimeout}`;")
          s=s.replace('sameTeam(b.home.x.away)', 'sameTeam(b.home,x.away)')
          s=s.replace("stage=`résolution ${i+1}/${bets.length}", "stage=`sélection ${i+1}/${bets.length}")
          s=s.replace('11.4.16','11.4.17')
          p.write_text(s)
          p=Path('index.html'); p.write_text(p.read_text().replace('V11.4.16','V11.4.17'))
          p=Path('package.json'); p.write_text(p.read_text().replace('"version":"11.4.16"','"version":"11.4.17"'))
          PY
      - name: Validate
        run: |
          node --check api/index.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw Error('script missing'); new Function(m[1]);"
      - name: Commit V11.4.17
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/index.js index.html package.json
          git commit -m 'Deploy V11.4.17 Browserless performance diagnostics'
          git push
