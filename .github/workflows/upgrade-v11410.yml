name: Upgrade V11.4.10
on:
  push:
    paths:
      - '.v11410-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V11.4.10
        run: echo '' | base64 -d | python
      - name: Commit V11.4.10
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-index.js index.html package.json
          git commit -m 'Deploy V11.4.10 robust Parions Sport fixture mapping'
          git push
