name: Upgrade V11.4.9
on:
  push:
    paths:
      - '.v1149-trigger'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: echo '' | base64 -d | python
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-index.js index.html package.json
          git commit -m 'Deploy V11.4.9 dynamic Parions Sport event mapping'
          git push
